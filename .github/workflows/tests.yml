# Runs both test suites on every pull request, and again on main once merged.
# Feature-branch pushes are left to their PR so each commit isn't run twice.
name: Tests

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same branch makes the running check moot.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit (Vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # CI=true (set by Actions) gives 2 workers and a fresh build + preview
      # server — see playwright.config.js. No retries: a flaky test should
      # show up red, not pass on a second try.
      - run: npm run test:e2e
      - name: Upload traces from failed tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
