name: Build

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    name: Production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The same `vite build` Vercel runs, so a broken build shows up red on
      # the commit instead of only as a failed deployment. No Firebase env
      # vars are needed: without them the app builds as local-only.
      - run: npm run build
